<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6b3f22">
<title>ยอดขาย Nani Cha</title>
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:#f4efe9;color:#2a1c13;font:16px/1.6 Prompt,system-ui,sans-serif;text-align:center}
button{margin-top:12px;padding:10px 22px;border:0;border-radius:14px;background:#6b3f22;color:#fff;font:inherit}
</style>
</head>
<body>
<p id="m">กำลังโหลดยอดขาย…</p>
<script>
// ลิงก์ดูยอดอย่างเดียว: view.html#k=รหัสดูยอด → โหลดยอดจากออนไลน์ แล้วเปิดหน้า POS โหมดดู (?view)
const SB='https://owbaacymjxehenribbgu.supabase.co/rest/v1/rpc/',SBK='sb_publishable_wdNoCZ3wxXJwT3KQsDVLEg_UT8BfoMF';
const m=document.getElementById('m');
// ข้อความภาษาสเปนเป็นค่าเริ่มต้น (แฟนพี่) ถ้าเคยกดเปลี่ยนเป็นไทยจะจำไว้
let es=true;try{es=localStorage.getItem('nanicha_lang')!=='th'}catch(e){}
const L=(th,sp)=>es?sp:th;
m.textContent=L('กำลังโหลดยอดขาย…','Cargando ventas…');
let k=(location.hash.match(/^#(?:k=)?([0-9a-z]+)$/)||[])[1];
try{if(!k)k=localStorage.getItem('nanicha_viewkey')}catch(e){}
const fail=t=>{m.innerHTML=t+'<br><button onclick="location.reload()">'+L('ลองใหม่','Reintentar')+'</button>'};
const BAD=L('ลิงก์ไม่ถูกต้อง ขอลิงก์ใหม่จากร้านค่ะ','Enlace no válido. Pide un enlace nuevo a la tienda.');
if(!k)m.textContent=BAD;
else{
  // โหลดตั้งแต่ต้นเดือนที่แล้ว (ดู "เดือนนี้" และเดือนก่อนได้)
  const n=new Date(),since=new Date(n.getFullYear(),n.getMonth()-1,1).getTime();
  fetch(SB+'nanicha_view',{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify({k,since})})
    .then(r=>{if(!r.ok)throw r.status;return r.json()})
    .then(v=>{
      try{localStorage.setItem('nanicha_viewkey',k)}catch(e){} // จำรหัสเฉพาะลิงก์ที่ใช้ได้
      if(!v.menu){m.textContent=L('ยังไม่มียอดจากเครื่องที่ร้านค่ะ','Aún no hay ventas enviadas desde la tienda.');return}
      sessionStorage.setItem('nanicha_view',JSON.stringify({settings:v.settings,menu:v.menu,orders:v.orders,shifts:v.shifts,shift:v.shift,syncedAt:v.syncedAt}));
      location.replace('./?view=1');
    })
    .catch(e=>fail(e===400||e===401?BAD:L('โหลดไม่ได้ เช็กเน็ตแล้วลองใหม่ค่ะ','No se pudo cargar. Revisa la conexión e inténtalo de nuevo.')));
}
</script>
</body>
</html>
